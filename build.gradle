import org.gradle.api.tasks.PathSensitivity

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.142'
    // Catches an enum switch that neither has a default nor covers every case at the
    // statement level - the shape of bug this project keeps finding by hand (PLAN.md rules
    // 20, 86, 89): a `switch` *expression* is already exhaustive by construction (the
    // compiler itself refuses a missing arm), but plain `switch` *statements* are not, and
    // that gap is exactly where a machine, a kind, or a family drifted before.
    id 'net.ltgt.errorprone' version '4.1.0'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
    // Jade publishes here. Soft dependency: compiled against, never required at run time.
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    // LDLib2 (Low-Drag-MC) - the UI framework the codex and magic-tier screens are built
    // on from here. A hard dependency, not soft: the screens do not fall back to drawing
    // themselves without it, the way Jade's readouts do.
    maven {
        name = "FirstDark"
        url = "https://maven.firstdark.dev/snapshots"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // A second client for local multiplayer testing (two windows, two players) — its own
        // game directory so it doesn't fight the first client's saves/options/logs, and its own
        // offline username so the two don't collide when joining the same world (offline-mode
        // UUIDs are derived from the username, so a different name is also a different identity).
        client2 {
            client()
            gameDirectory = project.file('run-client2')
            programArguments.addAll '--username', 'Dev2'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // The JEI API for compile time use
    compileOnly "mezz.jei:jei-${jei_mc_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_mc_version}-neoforge-api:${jei_version}"

    // The full JEI artifact to test with at runtime
    runtimeOnly "mezz.jei:jei-${jei_mc_version}-neoforge:${jei_version}"


    // Curios provides the equipment slots the EVA suit's components live in - core gameplay,
    // not an integration the mod merely enhances if present. compileOnly against the :api
    // classifier is a normal API-vs-impl compile split, not a marker of optionality; the full
    // runtime artifact is jarJar-embedded below alongside LDLib2/KilaGraph/Photon.
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"

    // Jade: look-at readouts. Soft dependency in every sense — compiled against,
    // present at runtime for testing, and the plugin is annotation-loaded so the mod
    // runs identically without it.
    compileOnly "maven.modrinth:jade:${jade_version}"
    runtimeOnly "maven.modrinth:jade:${jade_version}"

    // LDLib2, KilaGraph, Photon, Curios: hard dependencies, not soft ones - the codex/magic-
    // tier screens are built directly on LDLib2's widget/layout/style system, the planned
    // magic research tree and wire/logic-tier editor are node-graph UI (KilaGraph, which
    // LDLib2's own GraphView is built on), ritual/anomaly VFX is authored and triggered
    // through Photon, and the EVA suit lives in Curios' equipment slots. jarJar embeds all
    // four so players don't have to separately track down and install four more mod files -
    // only genuinely optional integrations (JEI/Jade, above) stay un-embedded. No ":all"
    // classifier on any of them - unlike some READMEs' generic examples (older releases on
    // other MC lines), each of these maven directories for our exact 26.1 line publishes only
    // the plain jar; Gradle Module Metadata (the .module file alongside it) resolves the right
    // variant on its own. Verified by browsing the maven directory listings directly, not
    // assumed from the docs.
    jarJar(runtimeOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}"))
    jarJar(implementation("com.lowdragmc.ldlib2:ldlib2-neoforge-26.1:${ldlib2_version}"))
    // transitive = false on Kila Graph/Photon, matching Photon's own documented consumer
    // snippet exactly: each already declares its own LDLib2/KilaGraph requirement in its POM,
    // and we pin those ourselves above - without this, Gradle would also pull in whatever
    // else rides along transitively (Iris/Sodium compile-time refs and the like) that we
    // neither need nor want on our own classpath.
    jarJar(implementation("com.lowdragmc.kilagraph:kilagraph-neoforge-26.1:${kilagraph_version}")) { transitive = false }
    jarJar(implementation("com.lowdragmc.photon:photon-neoforge-26.1:${photon_version}")) { transitive = false }

    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
}

// Only the two checks that catch a non-exhaustive enum switch statement — not Error Prone's
// full default rule set, which is a much bigger adoption decision this project hasn't made.
// disableAllChecks turns off everything else it ships with by default before turning these
// two back on.
tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        disableAllChecks = true
        check("MissingCasesInEnumSwitch", net.ltgt.gradle.errorprone.CheckSeverity.ERROR)
        check("UnnecessaryDefaultInEnumSwitch", net.ltgt.gradle.errorprone.CheckSeverity.ERROR)
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description,
                             ldlib2_version_range   : ldlib2_version_range,
                             kilagraph_version_range: kilagraph_version_range,
                             photon_version_range   : photon_version_range,
                             curios_version_range   : curios_version_range]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

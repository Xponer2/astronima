name: Release

# Push a tag like v1.2.3 to build the mod and publish it as a GitHub Release,
# with release notes generated automatically from the commits/PRs since the
# previous tag. "workflow_dispatch" lets you also trigger it by hand from the
# Actions tab, e.g. to rebuild a release without pushing a new tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Derive mod version from tag
        id: version
        run: |
          version="${{ steps.tag.outputs.name }}"
          version="${version#v}"
          echo "mod_version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build --no-daemon -Pmod_version=${{ steps.version.outputs.mod_version }}

      - name: Locate built jar
        id: jar
        run: |
          jar_path=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          if [ -z "$jar_path" ]; then
            echo "No jar found in build/libs" >&2
            exit 1
          fi
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"

      # Marks how big a jump this release is, using an icon already in the mod's own
      # assets (never generated) rather than inventing new art: astral_crystal for a
      # major version bump, wrench for minor, sealant_patch (a real in-game item for
      # patching a small leak) for a patch bump. The very first release counts as major.
      - name: Pick a release-size icon from the mod's own assets
        id: badge
        run: |
          current="${{ steps.version.outputs.mod_version }}"
          prev_tag=$(git tag --sort=-v:refname | grep -Fxv "${{ steps.tag.outputs.name }}" | head -n 1 || true)

          IFS='.' read -r cur_major cur_minor cur_patch <<< "$current"

          if [ -z "$prev_tag" ]; then
            kind="major"
          else
            prev="${prev_tag#v}"
            IFS='.' read -r prev_major prev_minor prev_patch <<< "$prev"
            if [ "$cur_major" -gt "$prev_major" ]; then
              kind="major"
            elif [ "$cur_major" -eq "$prev_major" ] && [ "$cur_minor" -gt "$prev_minor" ]; then
              kind="minor"
            else
              kind="patch"
            fi
          fi

          case "$kind" in
            major) icon="astral_crystal.png"; label="Major release" ;;
            minor) icon="wrench.png"; label="Minor release" ;;
            patch) icon="sealant_patch.png"; label="Patch release" ;;
          esac
          echo "icon=$icon" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      # GitHub's release-body sanitizer strips inline style="" from the <img> tag, so
      # image-rendering: pixelated never survives to the browser - a 16x16 source
      # texture then gets the browser's own default (smooth) upscaling and reads as
      # blurry, not pixel art. Fixed at the file, not the CSS: real nearest-neighbor
      # resampling (Image.NEAREST, the same tool tools/textures.py already builds every
      # texture with) makes the shipped icon file itself already crisp at display size,
      # so nothing depends on a style attribute the sanitizer might drop.
      - name: Scale the icon with real nearest-neighbor resampling
        id: scaled_icon
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 -c "
          from PIL import Image
          src = 'src/main/resources/assets/astronima/textures/item/${{ steps.badge.outputs.icon }}'
          img = Image.open(src).convert('RGBA')
          scale = 8
          img.resize((img.width * scale, img.height * scale), Image.NEAREST).save('release-icon.png')
          "
          echo "path=release-icon.png" >> "$GITHUB_OUTPUT"

      - name: Write release body
        run: |
          icon_url="https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/release-icon.png"
          {
            echo "<img src=\"${icon_url}\" width=\"128\" height=\"128\" alt=\"${{ steps.badge.outputs.label }}\">"
            echo ""
            echo "**${{ steps.badge.outputs.label }}**"
            echo ""
          } > release-body.md
          cat release-body.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Astronima ${{ steps.tag.outputs.name }}
          body_path: release-body.md
          generate_release_notes: true
          files: |
            ${{ steps.jar.outputs.path }}
            ${{ steps.scaled_icon.outputs.path }}

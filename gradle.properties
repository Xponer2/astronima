# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
## Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.26.1.2
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
# NOTE: the runtime game version is year-based ("26.1.2") even though the artifact
# coordinate is "1.26.1.2" - the range must match the runtime form.
minecraft_version_range=[26.1,27)
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.1.2.82
# The Neo version range can use any version of Neo as bounds
neo_version_range=[26,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[4,)
parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.21-nightly-SNAPSHOT
## Mod Properties
# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=astronima
# The human-readable display name for the mod.
mod_name=astronima
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=1.0-SNAPSHOT
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=play.xponer
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=

## JEI Properties
jei_mc_version=26.1.2
## Bumped from 29.6.2.38 2026-08-20: LDLib2 26.1.2.36 requires JEI >= 29.29.0.77 (an
## optional dependency whose version range NeoForge still enforces once JEI is present).
## 29.29.0.77 is JEI's own newest release for this exact MC line, not a version jump.
jei_version=29.29.0.77
## Curios: dedicated equipment slots for suit components
curios_version=15.0.0+26.1.2
curios_version_range=[15.0.0+26.1.2,)
jade_version=26.1.8+neoforge
## LDLib2: the UI/rendering framework the codex and magic-tier screens are rebuilt on
## (Taffy layout, LSS stylesheets, SDF rendering). Same library GTCEu Modern's own
## screens are built on. Confirmed on maven.firstdark.dev against MC 26.1.2 2026-08-20.
ldlib2_version=26.1.2.36
ldlib2_version_range=[26.1.2.36,)
## KilaGraph: the node-graph toolkit LDLib2's own GraphView is built on - node-based UI for
## the magic research tree and the wire/logic-tier editor. MIT license. Confirmed on
## maven.firstdark.dev against MC 26.1.2 2026-08-21; requires LDLib2 >=26.1.2.33 (we have
## 26.1.2.36).
kilagraph_version=26.1.0.9
kilagraph_version_range=[26.1.0.9,)
## Photon: VFX toolkit (particles/trails/beams/timeline/shader & post-processing graphs),
## authored in its own in-game editor and triggered from Java by resource id. CC BY-NC-SA
## 4.0 on the Photon mod itself; content authored with it (.fx files, graphs) is unrestricted
## and ours to license however we like. Confirmed on maven.firstdark.dev against MC 26.1.2
## 2026-08-21; requires LDLib2 >=26.1.2.31 and KilaGraph >=26.1.0.8 (we have both above).
photon_version=26.1.2.0
photon_version_range=[26.1.2.0,)
